# Runs the discovery pipeline on SAP-samples/cap-sflight and executes the generated cds.test suites in the app.
name: Discover SFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  SFLIGHT_REPO: https://github.com/SAP-samples/cap-sflight.git
  SFLIGHT_COMMIT: 7f42e8577c9bdbc2e51d1844ffc64ff00dd724f1
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install toolkit
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm i --no-save --legacy-peer-deps playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Check out SFlight at the pinned commit
        run: |
          git clone --quiet "$SFLIGHT_REPO" ../cap-sflight
          git -C ../cap-sflight checkout --quiet "$SFLIGHT_COMMIT"

      # Same setup as SFlight's own CI (.github/workflows/node.js.yml)
      - name: Install SFlight
        working-directory: ../cap-sflight
        run: |
          npm i -g @sap/cds-dk typescript tsx
          npm ci
          npx cds-typer "*"

      # addon rules: runs its Opengrep rules (addons/rules/opengrep) when the CLI is there
      - name: Install Opengrep
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/install-opengrep.sh

      - name: Run the discovery pipeline
        run: node bin/pipeline.js ../cap-sflight out/cap-sflight --base curated/cap-sflight.json

      # Addon runtime: start the app with cds.test and record every handler it registers (with its line)
      # and every served path, to check the static facts against the running app
      - name: Record what the app registers at startup
        continue-on-error: true
        working-directory: ../cap-sflight
        env:
          DISCOVERY_RECORDER: ${{ github.workspace }}/addons/runtime/record.js
          DISCOVERY_RUNTIME_OUT: ${{ github.workspace }}/out/cap-sflight/run/runtime.json
        run: |
          node "$GITHUB_WORKSPACE/bin/addon.js" enabled runtime || { echo "runtime addon is off"; exit 0; }
          mkdir -p test/discovery-startup
          cat > test/discovery-startup/startup.test.js <<'EOF'
          const fs = require('fs'), path = require('path')
          const cds = require('@sap/cds')
          const rec = require(process.env.DISCOVERY_RECORDER).start(path.resolve(__dirname, '../..'))
          cds.test(__dirname + '/../..')
          it('app starts', () => { rec.dump(process.env.DISCOVERY_RUNTIME_OUT, cds) })
          EOF
          npx jest test/discovery-startup --ci --forceExit || true
          rm -rf test/discovery-startup
          [ -f "$DISCOVERY_RUNTIME_OUT" ] || echo "::warning::runtime recording failed, the Runtime check section is left out"

      - name: Run SFlight's own tests (baseline)
        id: baseline
        continue-on-error: true
        working-directory: ../cap-sflight
        run: npx jest test/odata.test.ts --ci --json --outputFile="$GITHUB_WORKSPACE/out/jest-baseline.json"

      - name: Run the generated tests
        id: generated
        continue-on-error: true
        working-directory: ../cap-sflight
        run: |
          mkdir -p test/generated
          cp "$GITHUB_WORKSPACE"/out/cap-sflight/run/tests/generated/*.test.js test/generated/
          npx jest test/generated --ci --json --outputFile="$GITHUB_WORKSPACE/out/jest-generated.json"

      # Addon measured: authorization probe + request log + coverage (same step as discover.yml)
      - name: Measure authorization and requests
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ../cap-sflight
        env:
          DISCOVERY_MEASURE_OUT: ${{ github.workspace }}/out/cap-sflight/run/measured
        run: |
          node "$GITHUB_WORKSPACE/bin/addon.js" enabled measured || { echo "measured addon is off"; exit 0; }
          mkdir -p test/discovery-measure "$DISCOVERY_MEASURE_OUT"
          cp "$GITHUB_WORKSPACE"/addons/measured/{authz-probe.test.js,recorder.js} test/discovery-measure/
          rec="$PWD/test/discovery-measure/recorder.js"
          cov=(--coverage --coverageProvider=v8 --coverageReporters=json)
          npx jest test/discovery-measure test/generated --ci --forceExit --testTimeout 600000 \
            --setupFilesAfterEnv "$rec" "${cov[@]}" --coverageDirectory "$DISCOVERY_MEASURE_OUT/coverage-generated" || true
          setup=$(npx jest --showConfig 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).configs[0].setupFilesAfterEnv.length)}catch{console.log(0)}})")
          extra=(); [ "$setup" = 0 ] && extra=(--setupFilesAfterEnv "$rec") || echo "::notice::own Jest setup files kept: own tests run without the request log"
          npx jest test/odata.test.ts --ci --forceExit "${extra[@]}" "${cov[@]}" --coverageDirectory "$DISCOVERY_MEASURE_OUT/coverage-own" || true
          ls -R "$DISCOVERY_MEASURE_OUT" | head -20

      # Addon uitests: generated OPA5 journeys for the UI promises, run in the Fiori app in headless Chromium
      - name: Run the generated UI tests
        id: uitests
        continue-on-error: true
        run: |
          if node bin/addon.js enabled uitests; then
            node addons/uitests/run.js out/cap-sflight ../cap-sflight --baseline
          else
            echo "uitests addon is off"
          fi

      # Addons (discovery.config.json) that need the test results, e.g. coverage by class; rebuilds the atlas
      - name: Addons after tests
        if: always()
        run: |
          node bin/stages.js record out/cap-sflight run-tests ${{ steps.generated.outcome == 'success' && 'ran' || 'failed' }} "generated tests ${{ steps.generated.outcome }}" || true
          node bin/after-tests.js out/cap-sflight --generated out/jest-generated.json --baseline out/jest-baseline.json

      - name: Job summary
        if: always()
        run: |
          node .github/scripts/summary.js out > out/summary.md
          # addons put their PR snippets in out/<app>/pr/*.md
          for f in out/cap-sflight/pr/*.md; do [ -f "$f" ] && { echo; cat "$f"; } >> out/summary.md; done
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the summary on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/sticky-comment.sh discovery:sflight out/summary.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sflight-discovery
          path: out/

      - name: Fail if generated tests failed
        if: steps.generated.outcome != 'success' || steps.uitests.outcome == 'failure'
        run: |
          echo "Generated tests failed (backend: ${{ steps.generated.outcome }}, UI: ${{ steps.uitests.outcome }}): the app does not do what the pipeline derived. See the job summary."
          exit 1
